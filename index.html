<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>서울대 한국어 4A · 듣기 2</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');:root{--bg:#f3f6f8;--paper:#fff;--ink:#182c3a;--muted:#61717c;--line:#d6e0e5;--blue:#126b86;--blue-dark:#084a63;--pale:#e7f4f7;--correct:#198754;--correct-bg:#e4f5ea;--wrong:#c4513a;--wrong-bg:#fff0eb;--shadow:0 12px 30px rgba(18,66,85,.1)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef7f9,#f7f4ed);color:var(--ink);font-family:'Noto Sans KR',sans-serif;padding:28px 16px 56px}main{max-width:820px;margin:auto}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}.meta{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--blue);display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--pale)}h1{font:700 30px/1.3 'Gowun Batang',serif;margin:9px 0 8px}.guide{margin:0;color:var(--muted);font-size:15px;line-height:1.7}.player{margin:21px 0 18px;padding:17px 0;border-block:1px solid var(--line)}.player-top{display:flex;gap:12px;align-items:center}.play{border:0;background:var(--blue);color:white;border-radius:50%;width:46px;height:46px;font-size:17px;cursor:pointer}.seek{flex:1;accent-color:var(--blue);cursor:pointer}.time{font:500 12px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}.player-bottom,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{font:600 14px 'Noto Sans KR',sans-serif;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}button:hover,select:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.score{margin-left:auto;align-self:center;color:var(--muted);font:700 13px 'JetBrains Mono',monospace}.score b{color:var(--blue-dark);font-size:16px}.transcript{margin-top:20px;display:grid;gap:12px}.line{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:start}.speaker{font-weight:700;color:var(--blue-dark);padding:12px 4px}.speech{background:#f8fbfc;border:1px solid #e0eaee;border-radius:4px 15px 15px 15px;padding:11px 15px;font-size:17px;line-height:2.05}.line:nth-child(even) .speech{background:#fcfaf6;border-color:#ece4d8}.blank{font:600 16px 'Noto Sans KR',sans-serif;text-align:center;width:8ch;min-width:72px;border:0;border-bottom:2px solid var(--blue);border-radius:4px 4px 0 0;padding:1px 4px;background:#fff;color:var(--ink)}.blank.long{width:12ch}.blank.xlong{width:15ch}.blank.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}.blank.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}@media(max-width:600px){body{padding:14px 10px 36px}.card{padding:20px 16px}h1{font-size:25px}.line{grid-template-columns:1fr;gap:1px}.speaker{padding:3px 6px}.speech{font-size:16px;padding:10px 13px}.time{font-size:11px}.score{margin-left:0}.blank{font-size:15px}}</style></head>
<body><main><section class="card"><div class="meta"><span class="dot"></span>서울대 한국어 4A · 듣기 2 · TRACK 29 · P.76</div><h1>씨름 경기</h1><p class="guide">음원을 들으며 빈칸에 알맞은 어휘나 표현을 입력하세요. 필요한 경우 0.5배속까지 천천히 들을 수 있습니다.</p><audio id="audio" src="track29.mp3" preload="metadata"></audio><div class="player"><div class="player-top"><button class="play" id="play" aria-label="재생">▶</button><input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치"><span class="time" id="time">00:00 / 00:00</span></div><div class="player-bottom"><button id="back">⏪ 5초</button><button id="forward">5초 ⏩</button><select id="speed" aria-label="재생 속도"><option value="0.5">0.5x</option><option value="0.6">0.6x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option></select></div></div><div class="actions"><button class="primary" id="check">정답 확인</button><button id="reveal">정답 보기</button><button id="reset">↺ 다시 하기</button><span class="score">맞은 개수 <b id="score">0</b>/14</span></div></section><section class="transcript" id="transcript" aria-label="듣기 대본"></section><footer>듣기 2 · Seoul National University Korean 4A</footer></main>
<script>
const lines=[['남',['어, 씨름 경기를 하네.']],['여',['','오랜만에',' 씨름이나 볼까? 그런데 두 선수 ','체격 차이','가 너무 나는데.']],['남',['그러게. 이 경기는 ','해 보나 마나','일 것 같아. 체격이 큰 선수가 이길 게 ','틀림없어','.']],['여',['그건 모르는 일이야. ','길고 짧은 건',' ','대봐야',' 안다고 하잖아. 두고 봐야지.']],['남',['에이, 무슨 소리야? 씨름은 ','무엇보다',' 힘이 중요하니까 체격이 클수록 ','유리하지','. 체격이 큰 선수가 이길 게 틀림없어.']],['여',['힘도 중요하지만 기술도 중요해. 전에 봤는데 체격이 작은 선수가 기술을 잘 써서 자기보다 ','훨씬',' 큰 선수도 쉽게 이기더라고. 이 경기 ','결과도',' 아직 모르는 거야. 어, 시작하나 보다.']],['남',['둘이 ','막상막하네','. 작은 선수가 생각보다 ','승부욕','이 강한데. 금방 끝날 줄 알았는데 승부가 쉽게 안 나겠어.']],['여',['야, 정말 흥미진진한데. 어, 작은 선수가 넘어질 것 같은데. 아, ','아슬아슬하게',' 잘 버티네. 와, 이겼다. 그것 봐. 길고 짧은 건 대봐야 안다고 했지?']],['남',['아, 이길 수 있었는데 ','균형을 잃는 바람에',' 졌어. 아쉽다.']]];
const answers=['오랜만에','체격 차이','해 보나 마나','틀림없어','길고 짧은 건','대봐야','무엇보다','유리하지','훨씬','결과도','막상막하네','승부욕','아슬아슬하게','균형을 잃는 바람에'], widths={'체격 차이':'long','해 보나 마나':'long','길고 짧은 건':'long','아슬아슬하게':'long','균형을 잃는 바람에':'xlong'};let n=0;const transcript=document.querySelector('#transcript');for(const [speaker,parts]of lines){const row=document.createElement('div'),label=document.createElement('div'),speech=document.createElement('div');row.className='line';label.className='speaker';speech.className='speech';label.textContent=speaker;for(const p of parts){if(answers.includes(p)){n++;const input=document.createElement('input');input.className='blank '+(widths[p]||'');input.dataset.answer=p;input.autocomplete='off';input.setAttribute('aria-label',`${n}번 빈칸`);speech.append(input)}else speech.append(document.createTextNode(p))}row.append(label,speech);transcript.append(row)}
const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time'),speed=document.querySelector('#speed'),fmt=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration;time.textContent=`00:00 / ${fmt(audio.duration)}`});audio.addEventListener('timeupdate',()=>{seek.value=audio.currentTime;time.textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`});audio.addEventListener('play',()=>play.textContent='⏸');audio.addEventListener('pause',()=>play.textContent='▶');play.onclick=()=>audio.paused?audio.play():audio.pause();seek.oninput=()=>audio.currentTime=seek.value;document.querySelector('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);document.querySelector('#forward').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);speed.onchange=()=>audio.playbackRate=Number(speed.value);
const inputs=()=>[...document.querySelectorAll('.blank')];document.querySelector('#check').onclick=()=>{let correct=0;inputs().forEach(i=>{const ok=i.value.trim()===i.dataset.answer;i.classList.remove('correct','wrong');i.classList.add(ok?'correct':'wrong');if(ok)correct++});document.querySelector('#score').textContent=correct};document.querySelector('#reveal').onclick=()=>{inputs().forEach(i=>{i.value=i.dataset.answer;i.classList.remove('wrong');i.classList.add('correct')});document.querySelector('#score').textContent=14};document.querySelector('#reset').onclick=()=>{inputs().forEach(i=>{i.value='';i.classList.remove('correct','wrong')});document.querySelector('#score').textContent=0};
</script></body></html>
